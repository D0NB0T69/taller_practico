<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de tareas</title>
    <link rel="stylesheet" href="estilos.css/inicio.css">
</head>
<body>
    <h1>Historial de Tareas Diarias</h1>
  <div>
    <form id="formTarea">
       <h2 class="h2">Nueva Tarea</h2>
  <table class="form_tabla">
    <tr>
      <td><label for="fecha">Fecha:</label></td>
      <td><input type="date" id="fecha" required></td>
    </tr>
    <tr>
      <td><label for="descripcion">Descripción:</label></td>
      <td><textarea id="descripcion" placeholder="descripcion" required></textarea></td>
    </tr>
    <tr>
      <td colspan="2">
        <button type="submit">  Agregar Tarea</button>
        </td>
    </tr>
  </table>
  </form>
<!-- Aquí aparece el mensaje -->

<div id="mensaje" class="mensaje">
  </div>
  <div class="filtros">
      <input type="text" id="buscar" placeholder="buscar">
      <select id="filtro">
        <option value="todas">Todas</option>
        <option value="pendientes">Pendientes</option>
        <option value="completadas">Completadas</option>
      </select>
   </div>
</div>

    <div>
        <img src="img/5100114.png" alt="perrito" class="perrito">
    </div>

    <script src="js/local.js"></script>
</body>
</html>
